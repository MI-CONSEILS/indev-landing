<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="iri" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0" stop-color="#ff3ea5"/>
      <stop offset="0.16" stop-color="#b83cff"/>
      <stop offset="0.32" stop-color="#5a4dff"/>
      <stop offset="0.48" stop-color="#2f9bff"/>
      <stop offset="0.62" stop-color="#4fe4ff"/>
      <stop offset="0.76" stop-color="#8f7bff"/>
      <stop offset="0.9" stop-color="#ff5bc0"/>
      <stop offset="1" stop-color="#ff7a8f"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#9fc6ff" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#2c3f8c" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#080d26"/>
      <stop offset="1" stop-color="#03050f"/>
    </linearGradient>

    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#020614" stop-opacity="0.35"/>
      <stop offset="0.86" stop-color="#01030c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.95"/>
    </radialGradient>

    <radialGradient id="lens" cx="0.55" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#000208" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#04091f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="swirl" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.015" numOctaves="4" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="62" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>

    <filter id="soft" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="tight" x="-60%" y="-80%" width="220%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <clipPath id="face">
      <ellipse cx="200" cy="132" rx="186" ry="88"/>
    </clipPath>
  </defs>

  <!-- edge thickness -->
  <ellipse cx="200" cy="170" rx="186" ry="88" fill="url(#edge)"/>
  <g clip-path="url(#face)" transform="translate(0 38)">
    <rect x="-40" y="0" width="480" height="300" fill="url(#iri)" filter="url(#swirl)" opacity="0.45" style="mix-blend-mode:screen"/>
  </g>

  <!-- glass body -->
  <ellipse cx="200" cy="132" rx="186" ry="88" fill="#04081c"/>

  <g clip-path="url(#face)">
    <rect x="-40" y="-20" width="480" height="340" fill="url(#iri)" filter="url(#swirl)" opacity="0.95" style="mix-blend-mode:screen"/>
    <rect x="-40" y="-20" width="480" height="340" fill="url(#iri)" filter="url(#swirl)" opacity="0.4" transform="rotate(180 200 132)" style="mix-blend-mode:color-dodge"/>

    <!-- depth: dark rim vignette + lens hollow -->
    <ellipse cx="200" cy="132" rx="186" ry="88" fill="url(#core)"/>
    <ellipse cx="200" cy="134" rx="120" ry="54" fill="url(#lens)"/>
    <ellipse cx="200" cy="134" rx="120" ry="54" fill="none" stroke="#dcecff" stroke-opacity="0.4" stroke-width="1.4"/>

    <!-- speculars -->
    <ellipse cx="128" cy="90" rx="86" ry="26" fill="#ffffff" opacity="0.5" filter="url(#soft)" transform="rotate(-13 128 90)"/>
    <ellipse cx="110" cy="86" rx="26" ry="8" fill="#ffffff" opacity="0.98" filter="url(#tight)" transform="rotate(-13 110 86)"/>
    <ellipse cx="272" cy="180" rx="62" ry="14" fill="#a8dcff" opacity="0.55" filter="url(#soft)" transform="rotate(-8 272 180)"/>
  </g>

  <!-- rim light -->
  <ellipse cx="200" cy="132" rx="186" ry="88" fill="none" stroke="#eef6ff" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
