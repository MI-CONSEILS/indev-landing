<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="siri" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff3ea5"/>
      <stop offset="0.17" stop-color="#b83cff"/>
      <stop offset="0.34" stop-color="#5a4dff"/>
      <stop offset="0.5" stop-color="#2f9bff"/>
      <stop offset="0.64" stop-color="#4fe4ff"/>
      <stop offset="0.78" stop-color="#8f7bff"/>
      <stop offset="0.91" stop-color="#ff5bc0"/>
      <stop offset="1" stop-color="#ff7a8f"/>
    </linearGradient>

    <radialGradient id="score" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#01040f" stop-opacity="0.3"/>
      <stop offset="0.82" stop-color="#01030c" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.96"/>
    </radialGradient>

    <radialGradient id="shade" cx="0.3" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#000208" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.9"/>
    </radialGradient>

    <radialGradient id="bounce" cx="0.74" cy="0.84" r="0.42">
      <stop offset="0" stop-color="#7fd0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="sswirl" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.01" numOctaves="4" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="70" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>

    <filter id="ssoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="stight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <filter id="crescent" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="ball">
      <circle cx="160" cy="160" r="150"/>
    </clipPath>
  </defs>

  <circle cx="160" cy="160" r="150" fill="#04081c"/>

  <g clip-path="url(#ball)">
    <rect x="-30" y="-30" width="380" height="380" fill="url(#siri)" filter="url(#sswirl)" opacity="0.92" style="mix-blend-mode:screen"/>
    <rect x="-30" y="-30" width="380" height="380" fill="url(#siri)" filter="url(#sswirl)" opacity="0.34" transform="rotate(150 160 160)" style="mix-blend-mode:color-dodge"/>

    <circle cx="160" cy="160" r="150" fill="url(#score)"/>
    <circle cx="160" cy="160" r="150" fill="url(#shade)"/>
    <circle cx="160" cy="160" r="150" fill="url(#bounce)"/>

    <!-- back-light crescent: black neutralises under screen, leaving a lit edge -->
    <g style="mix-blend-mode:screen" opacity="0.7" filter="url(#crescent)">
      <circle cx="160" cy="160" r="150" fill="#a8dcff"/>
      <circle cx="143" cy="139" r="153" fill="#000000"/>
    </g>

    <ellipse cx="106" cy="94" rx="52" ry="30" fill="#ffffff" opacity="0.5" filter="url(#ssoft)" transform="rotate(-24 106 94)"/>
    <ellipse cx="96" cy="86" rx="20" ry="12" fill="#ffffff" filter="url(#stight)" transform="rotate(-24 96 86)"/>
    <ellipse cx="128" cy="112" rx="7" ry="5" fill="#ffffff" opacity="0.9" filter="url(#stight)"/>
  </g>

  <circle cx="160" cy="160" r="149" fill="none" stroke="#eef6ff" stroke-opacity="0.28" stroke-width="1.4"/>
</svg>
